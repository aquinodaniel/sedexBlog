<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEDEX - Login</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <header>
        <p>SEDEX</p>
        <div class="nav-links">
            <a href="register">CRIAR CONTA</a>
            <a href="intro">VOLTAR</a>
        </div>
    </header>

    <main>
        <div class="form-container">
            <h1>Bem-vindo de volta!</h1>
            <form action="#" method="POST">
                <div class="input-group">
                    <label for="username">Username ou E-mail</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required>
                </div>

                <button type="submit">ENTRAR</button>
            </form>

            <p class="register-link">
                Não tem uma conta? <a href="/app/views/register.html">Cadastre-se aqui</a>
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 SEDEX. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
