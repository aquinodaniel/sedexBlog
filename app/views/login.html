<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEDEX - Login</title>
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

    <div id="toast" class="toast {{ sucesso is defined ? 'show' : '' }}">
        {% if sucesso %}
        <div id="toast" class="toast show">
            {{ sucesso }}
            <div class="toast-progress"></div>
        </div>
        {% endif %}

    </div>

    <header>
        <p>SEDEX</p>
        <div class="nav-links">
            <a href="register">CRIAR CONTA</a>
            <a href="intro">VOLTAR</a>
        </div>
    </header>

    <main>
        <div class="form-container">


            {% if erro %}
            <div class="alert_erro">
                {{ erro }}
            </div>
            {% endif %}
            <form action="login" method="POST">
                <div class="input-group">
                    <label for="username">Username ou E-mail</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required>
                </div>

                <button type="submit">ENTRAR</button>
            </form>

            <p class="register-link">
                Não tem uma conta? <a href="register">Cadastre-se aqui</a>
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 SEDEX. Todos os direitos reservados.</p>
    </footer>
</body>

<script>
    const toast = document.getElementById('toast');
    if (toast.classList.contains('show')) {
        setTimeout(() => {
            toast.classList.remove('show');
        }, 4000); // 4 segundos
    }

        window.addEventListener('DOMContentLoaded', () => {
        const toast = document.getElementById('toast');
        if (toast) {
            setTimeout(() => {
                toast.classList.remove('show');
                toast.style.display = 'none';
            }, 4000); // tempo total em milissegundos (4s)
        }
    });

</script>

</script>

</html>
